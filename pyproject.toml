# Python tool settings: lint/format (ruff) and type checks (mypy). Run:
#   ruff check . && ruff format --check . && mypy

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions", "frontend", "loadtest", ".claude", "def power_sum*"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade, S bandit-lite (security), SIM simplify
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM"]
ignore = [
    "E501",    # long lines: the formatter handles code; long strings/comments are fine
    "B008",    # FastAPI's Depends(...) in defaults is the intended pattern
    "S101",    # assert is how pytest works
    "S311",    # random for non-security things (load test, demo data) is fine; codes use `secrets`
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S603", "S607", "B017"]   # fake passwords, subprocess in tests
"scripts/*" = ["S105", "S106", "S310", "S603", "S607", "E402"]  # local tools: urllib, demo passwords, sys.path

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

# redis-py's built-in types merge the sync and async clients (every call "may return an Awaitable"),
# which is wrong for the sync client used here. Treat the library as untyped instead of littering casts.
[[tool.mypy.overrides]]
module = ["redis", "redis.*"]
follow_imports = "skip"
